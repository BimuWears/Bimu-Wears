
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIMU WEARS — Admin</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>

<header>
  <a href="./index.html" style="text-decoration:none;color:#222;font-size:20px;font-weight:bold;">
    BIMU WEARS
  </a>

  <a href="./index.html" class="btn">View Website</a>
</header>

<section class="section">

  <h2>Admin Panel</h2>

  <div style="max-width:450px;margin:30px auto;">

    <h3>Admin Login</h3>

    <label>Email</label>
    <input id="email" type="email"
      placeholder="Admin email"
      style="width:100%;padding:12px;margin:8px 0 15px;">

    <label>Password</label>
    <input id="password" type="password"
      placeholder="Password"
      style="width:100%;padding:12px;margin:8px 0 15px;">

    <button onclick="loginAdmin()">LOGIN</button>

  </div>

  <hr style="margin:40px 0;border:0;border-top:1px solid #eee;">

  <div style="max-width:600px;margin:auto;">

    <h3>Add Product</h3>

    <label>Product Name</label>
    <input id="productName"
      placeholder="Product name"
      style="width:100%;padding:12px;margin:8px 0 15px;">

    <label>Price</label>
    <input id="productPrice"
      type="number"
      placeholder="Price in Rs"
      style="width:100%;padding:12px;margin:8px 0 15px;">

    <label>Product Image URL</label>
    <input id="productImage"
      placeholder="Image URL"
      style="width:100%;padding:12px;margin:8px 0 15px;">

    <label>Description</label>
    <textarea id="productDescription"
      rows="4"
      placeholder="Product description"
      style="width:100%;padding:12px;margin:8px 0 15px;"></textarea>

    <button onclick="addProduct()">ADD PRODUCT</button>

  </div>

  <hr style="margin:40px 0;border:0;border-top:1px solid #eee;">

  <div style="max-width:700px;margin:auto;">

    <h3>Orders</h3>

    <div id="orders" style="margin-top:20px;">
      Loading orders...
    </div>

  </div>

</section>

<script type="module" src="./admin.js"></script>

</body>
</html>
